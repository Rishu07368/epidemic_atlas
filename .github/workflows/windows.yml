name: Windows build and package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify unit tests
        run: mvn -B clean verify
      - name: Install WiX for MSI packaging
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "WiX installation failed." }
            $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v*\bin\candle.exe" |
              Select-Object -First 1
            if (-not $candle) { throw "WiX candle.exe was not found after installation." }
            $env:PATH += ";" + $candle.DirectoryName
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw "WiX candle.exe is required for MSI packaging."
          }
      - name: Build Windows distributions
        shell: pwsh
        run: .\scripts\package-windows.ps1 -IncludeInstaller
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: epidemic-atlas-windows
          path: |
            dist/EpidemicAtlas-*.zip
            dist/EpidemicAtlas-*.msi
            dist/release-manifest.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EpidemicAtlas-*.zip
            dist/EpidemicAtlas-*.msi
            dist/release-manifest.txt
            dist/SHA256SUMS.txt
